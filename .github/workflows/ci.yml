name: test
on:
  push:
  pull_request:
jobs:
  syntax-and-doctor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check every module
        shell: bash
        run: |
          for f in lib/*.js bin/*.mjs scripts/*.mjs test/*.mjs; do
            echo "check $f"
            node --check "$f"
          done
      - name: doctor + ui suites
        run: |
          node test/run-data-layer.mjs
          node test/run-doctor.mjs
          node test/run-ui.mjs
          node test/run-cli.mjs
      - name: install + doctor end-to-end
        run: node scripts/verify-install.mjs

  registry-parity:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:publish
