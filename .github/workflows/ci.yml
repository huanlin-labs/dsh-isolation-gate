name: test
on:
  push:
  pull_request:
jobs:
  syntax-and-doctor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check every module
        run: |
          node --check lib/index.js
          node --check lib/store.js
          node --check lib/roster.js
          node --check lib/dirs.js
          node --check lib/audit.js
          node --check bin/gate.mjs
          node --check bin/gate-setup.mjs
          node --check bin/gate-ui.mjs
          node --check bin/gate-mcp.mjs
      - name: doctor + ui suites
        run: |
          node test/run-doctor.mjs
          node test/run-ui.mjs

  registry-parity:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:publish
